  - id: aws6-api-gateway-account-reset-on-delete
    kind: removed
    severity: breaking
    match:
      block_kind: resource
      type: aws_api_gateway_account
      attributes: [reset_on_delete]
    title: "`aws_api_gateway_account`: `reset_on_delete` removed"
    detail: >-
      Destroy now always resets the account settings. To keep the old behaviour,
      remove the resource from state with a `removed` block instead.
    guide_anchor: "#resource-aws_api_gateway_account"
  - id: aws6-api-gateway-deployment-stage
    kind: state-move
    severity: breaking
    match:
      block_kind: resource
      type: aws_api_gateway_deployment
      attributes: [stage_name, stage_description, canary_settings]
    title: "`aws_api_gateway_deployment`: implicit stage arguments removed"
    detail: >-
      Declare the stage explicitly with `aws_api_gateway_stage` and import the
      existing one: `terraform import aws_api_gateway_stage.prod rest_api_id/stage_name`.
      `invoke_url` and `execution_arn` moved to the stage resource too.
    guide_anchor: "#resource-aws_api_gateway_deployment"
    suggested_diff: |2
       resource "aws_api_gateway_deployment" "example" {
         rest_api_id = aws_api_gateway_rest_api.example.id
      -  stage_name  = "prod"
       }
      +
      +resource "aws_api_gateway_stage" "prod" {
      +  stage_name    = "prod"
      +  rest_api_id   = aws_api_gateway_rest_api.example.id
      +  deployment_id = aws_api_gateway_deployment.example.id
      +}
