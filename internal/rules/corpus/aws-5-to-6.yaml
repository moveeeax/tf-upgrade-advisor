# Breaking changes for the hashicorp/aws provider, 5.x -> 6.x.
#
# Every rule is transcribed by hand from the official upgrade guide; guide_anchor
# is the heading it came from, so any claim in a report can be checked at source.
# Nothing here is inferred, generated or summarised by a model.
provider: aws
from: 5
to: 6
guide_url: https://registry.terraform.io/providers/hashicorp/aws/latest/docs/guides/version-6-upgrade

rules:
  # --- provider block ------------------------------------------------------
  - id: aws6-provider-endpoints-opsworks
    kind: removed
    severity: breaking
    match:
      block_kind: provider
      type: aws
      attributes: [endpoints.opsworks]
    title: "provider: `endpoints.opsworks` removed"
    detail: Removed following AWS OpsWorks Stacks end of life. Delete the override.
    guide_anchor: "#removed-provider-arguments"

  - id: aws6-provider-endpoints-simpledb
    kind: removed
    severity: breaking
    match:
      block_kind: provider
      type: aws
      attributes: [endpoints.simpledb, endpoints.sdb]
    title: "provider: `endpoints.simpledb` / `endpoints.sdb` removed"
    detail: Removed with Amazon SimpleDB support. Delete the override.
    guide_anchor: "#removed-provider-arguments"

  - id: aws6-provider-endpoints-worklink
    kind: removed
    severity: breaking
    match:
      block_kind: provider
      type: aws
      attributes: [endpoints.worklink]
    title: "provider: `endpoints.worklink` removed"
    detail: Removed with Amazon WorkLink support. Delete the override.
    guide_anchor: "#removed-provider-arguments"

  - id: aws6-provider-s3-us-east-1-regional-endpoint
    kind: deprecated
    severity: warning
    match:
      block_kind: provider
      type: aws
      attributes: [s3_us_east_1_regional_endpoint]
    title: "provider: `s3_us_east_1_regional_endpoint` deprecated"
    detail: >-
      The global S3 endpoint is deprecated and this argument is removed in 7.0.0.
      Drop the argument, or set it to `regional` and verify S3 access in us-east-1.
    guide_anchor: "#s3-global-endpoint-deprecation"
    suggested_diff: |2
      -  s3_us_east_1_regional_endpoint = "legacy"
      +  # removed: the global S3 endpoint is deprecated

