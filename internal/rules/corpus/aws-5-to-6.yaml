    title: "data `aws_launch_template`: elastic GPU / inference arguments removed"
    detail: Elastic Graphics ended January 2024 and Elastic Inference April 2024.
    guide_anchor: "#data-source-aws_launch_template"
  - id: aws6-data-opensearch-domain-kibana-endpoint
