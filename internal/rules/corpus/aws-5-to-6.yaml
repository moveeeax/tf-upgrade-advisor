  # --- data sources --------------------------------------------------------
  - id: aws6-data-ami-most-recent
    kind: required
    severity: warning
    match:
      block_kind: data
      type: aws_ami
      attributes: [most_recent]
    title: "data `aws_ami`: `most_recent = true` now needs `owners` or an identifying filter"
    detail: >-
      What used to be a warning is now an error. Add `owners`, or a `filter` on
      `image-id` or `owner-id`. `allow_unsafe_filter = true` overrides the check
      and is not recommended.
    guide_anchor: "#data-source-aws_ami"
    suggested_diff: |2
         most_recent = true
      +  owners      = ["amazon"]
  - id: aws6-data-batch-compute-environment-name
    kind: renamed
    severity: breaking
    match:
      block_kind: data
      type: aws_batch_compute_environment
      attributes: [compute_environment_name]
    title: "data `aws_batch_compute_environment`: `compute_environment_name` renamed to `name`"
    guide_anchor: "#data-source-aws_batch_compute_environment"
    suggested_diff: |2
      -  compute_environment_name = "example"
      +  name                     = "example"
  - id: aws6-data-ecs-task-definition-inference-accelerator
    kind: removed
    severity: breaking
    match:
      block_kind: data
      type: aws_ecs_task_definition
      attributes: [inference_accelerator]
    title: "data `aws_ecs_task_definition`: `inference_accelerator` removed"
    detail: Amazon Elastic Inference reached end of life in April 2024.
    guide_anchor: "#data-source-aws_ecs_task_definition"
  - id: aws6-data-ecs-task-execution-inference-accelerator-overrides
    kind: removed
    severity: breaking
    match:
      block_kind: data
      type: aws_ecs_task_execution
      attributes: [inference_accelerator_overrides]
    title: "data `aws_ecs_task_execution`: `inference_accelerator_overrides` removed"
    detail: Amazon Elastic Inference reached end of life in April 2024.
    guide_anchor: "#data-source-aws_ecs_task_execution"
  - id: aws6-data-elbv2-listener-rule-retyped
    kind: retyped
    severity: warning
    match: {block_kind: data, type: aws_elbv2_listener_rule}
    title: "data `aws_elbv2_listener_rule`: nested attributes are now lists of blocks"
    detail: >-
      The configuration does not change, but references do: `action`, `condition`
      and their nested attributes now need an index, e.g.
      `action[0].authenticate_cognito.scope` becomes
      `action[0].authenticate_cognito[0].scope`.
    guide_anchor: "#data-source-aws_elbv2_listener_rule"
  - id: aws6-data-globalaccelerator-accelerator-id
    kind: retyped
    severity: breaking
    match:
      block_kind: data
      type: aws_globalaccelerator_accelerator
      attributes: [id]
    title: "data `aws_globalaccelerator_accelerator`: `id` is computed-only"
    detail: Setting `id` is now an error. Remove it and select the accelerator another way.
    guide_anchor: "#data-source-aws_globalaccelerator_accelerator"
  - id: aws6-data-identitystore-group-filter
    kind: removed
    severity: breaking
    match:
      block_kind: data
      type: aws_identitystore_group
      attributes: [filter]
    title: "data `aws_identitystore_group`: `filter` removed"
    detail: Use `alternate_identifier` to locate the group.
    guide_anchor: "#data-source-aws_identitystore_group"
  - id: aws6-data-identitystore-user-filter
    kind: removed
    severity: breaking
    match:
      block_kind: data
