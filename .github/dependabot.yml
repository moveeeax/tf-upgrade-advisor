version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  # Keeps the pinned action versions in ci.yml and action.yml current; a stale
  # actions/setup-go is exactly the kind of drift consumers of a composite
  # action inherit silently.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
